<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almuntahatayseer - Daily Habit Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root{--navy:#0a192f;--black:#0f172a;--white:#fff;--bg:#f1f5f9;--green-bg:#ecfdf5;--green-border:#10b981;--green-text:#065f46;--red-bg:#fef2f2;--red-border:#f87171;--red-text:#991b1b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--black);display:flex;justify-content:center;padding:20px 12px;min-height:100vh}
  .app-container{width:100%;max-width:520px;background:var(--white);border-radius:20px;box-shadow:0 20px 40px rgba(10,25,47,.12);overflow:hidden;border:1px solid #e2e8f0;align-self:flex-start}
  .header{background:linear-gradient(135deg,var(--navy),var(--black));color:var(--white);padding:32px 24px;text-align:center;border-bottom:4px solid #1e3a8a}
  .badge{display:inline-block;background:rgba(255,255,255,.12);padding:5px 14px;border-radius:50px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;color:#cbd5e1}
  .header h1{font-size:26px;font-weight:800;letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
  .header p{font-size:13px;color:#94a3b8}
  .tabs{display:flex;background:#f8fafc;border-bottom:1px solid #e2e8f0}
  .tab{flex:1;padding:14px;border:0;background:none;font:600 13px 'Plus Jakarta Sans',sans-serif;color:#64748b;cursor:pointer;border-bottom:3px solid transparent}
  .tab.active{color:var(--navy);border-bottom-color:var(--navy);background:var(--white)}
  .content{padding:24px 20px}
  .category-title{font-size:14px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.8px;margin:24px 0 12px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
  .category-title:first-child{margin-top:0}
  .habit-card{display:flex;align-items:flex-start;padding:14px 16px;border-radius:12px;margin-bottom:10px;cursor:pointer;transition:all .25s ease;border:1.5px solid var(--red-border);background:var(--red-bg)}
  .habit-card.completed{border-color:var(--green-border);background:var(--green-bg)}
  .habit-card input[type=checkbox]{appearance:none;-webkit-appearance:none;min-width:22px;height:22px;border-radius:6px;border:2px solid var(--red-border);background:var(--white);margin-right:14px;margin-top:2px;cursor:pointer;display:grid;place-content:center;transition:.2s}
  .habit-card.completed input[type=checkbox]{background:var(--green-border);border-color:var(--green-border)}
  .habit-card input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid var(--white);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .15s ease}
  .habit-card input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
  .habit-info{flex:1}
  .habit-title{font-size:15px;font-weight:700;color:var(--red-text);display:block;margin-bottom:3px;transition:.2s}
  .habit-card.completed .habit-title{color:var(--green-text)}
  .habit-desc{font-size:13px;color:#475569;line-height:1.4;display:block}
  .score-box{background:var(--navy);color:var(--white);margin-top:28px;padding:24px 20px;border-radius:16px;text-align:center;box-shadow:0 10px 25px rgba(10,25,47,.2)}
  .score-label{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:#94a3b8;margin-bottom:8px;font-weight:600}
  .score-number{font-size:42px;font-weight:800;line-height:1;margin-bottom:14px}
  .score-number span{font-size:20px;color:#38bdf8}
  .progress-bar-bg{width:100%;height:10px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .progress-bar-fill{height:100%;width:0;background:#10b981;border-radius:10px;transition:width .4s ease}
  .score-summary{font-size:13px;color:#cbd5e1}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
  .stat{background:var(--navy);color:var(--white);border-radius:14px;padding:16px 8px;text-align:center}
  .stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
  .stat b i{font-style:normal;font-size:13px;color:#38bdf8;margin-left:2px}
  .stat small{font-size:11px;color:#94a3b8;font-weight:600}
  .week{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:150px;padding:10px 4px 0}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
  .bar{width:100%;max-width:34px;background:#e2e8f0;border-radius:8px 8px 4px 4px;min-height:6px}
  .bar.good{background:var(--green-border)}
  .bar.mid{background:#fbbf24}
  .bar-pct{font-size:11px;font-weight:700;color:#475569}
  .bar-day{font-size:11px;color:#64748b;font-weight:600}
  .note{font-size:12px;color:#64748b;line-height:1.5;margin-top:14px}
  .btn-row{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--navy);background:var(--white);color:var(--navy);font:700 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-align:center}
  .btn:hover{background:var(--navy);color:var(--white)}
  .hidden{display:none}
  .contact{padding:22px 20px;text-align:center;border-top:1px solid #e2e8f0}
  .contact h3{font-size:14px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
  .contact p{font-size:13px;color:#64748b;margin-bottom:14px}
  .contact-row{display:flex;gap:10px}
  .contact a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border-radius:10px;color:#fff;text-decoration:none;font-weight:700;font-size:13px}
  .contact a svg{width:18px;height:18px;fill:#fff;flex-shrink:0}
  .wa{background:#25d366}.ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
  .contact a:hover{opacity:.9}
  .footer{text-align:center;padding:16px;font-size:12px;color:#64748b;background:#f8fafc;border-top:1px solid #e2e8f0;font-weight:500}

  /* ===== Web (desktop) layout + black background ===== */
  html{background:#000}
  body{background:#000;padding:28px 20px}
  .app-container{max-width:1100px;margin:0 auto;border:1px solid #1f2937;box-shadow:0 20px 60px rgba(255,255,255,.04)}
  .header{padding:48px 24px}
  .header h1{font-size:34px}
  .header p{font-size:15px}
  .content{padding:32px 36px}
  #todayView{display:grid;grid-template-columns:repeat(2,1fr);column-gap:20px;align-items:start}
  #todayView .category-title,#todayView .score-box{grid-column:1/-1}
  #todayView .category-title{margin-top:28px}
  #todayView .category-title:first-child{margin-top:0}
  .score-box{max-width:520px;width:100%;justify-self:center;margin-top:32px}
  #historyView{max-width:760px;margin:0 auto;width:100%}
  .contact{max-width:560px;margin:0 auto;border-top:0;padding:28px 20px}
  .contact-wrap{border-top:1px solid #e2e8f0}
  @media (max-width:760px){
    body{padding:14px 10px}
    .header{padding:32px 20px}
    .header h1{font-size:26px}
    .content{padding:24px 18px}
    #todayView{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="badge">Daily Self-Growth Portal</div>
    <h1>Almuntahatayseer</h1>
    <p id="currentDate">Loading date...</p>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="history">History</button>
  </div>
  <div class="content" id="todayView"></div>
  <div class="content hidden" id="historyView"></div>
  <div class="contact-wrap"><div class="contact">
    <h3>Get In Touch</h3>
    <p>Questions or feedback? We would love to hear from you.</p>
    <div class="contact-row">
      <a class="wa" href="https://wa.me/923334663063" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.3-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.1-.2-1.2-1.6-1.2-3s.8-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.1 1.6Z"/></svg>WhatsApp</a>
      <a class="ig" href="https://www.instagram.com/Almuntahatayseer" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm5.2-3.2a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/></svg>@Almuntahatayseer</a>
    </div>
  </div>
  </div>
  <div class="footer">A new day begins every day at midnight &bull; Almuntahatayseer Official</div>
</div>

<script>
  const habitData = [
    { category: "1. Spiritual Peace (Azkar & Charity)", items: [
      { id: "azkar", title: "Morning & Evening Azkar", desc: "Begin and end your day with the remembrance of Allah." },
      { id: "shukr", title: "3 Gratitudes", desc: "Say Alhamdulillah from the heart for 3 blessings every day." },
      { id: "sadqa", title: "Daily Sadqa", desc: "Give a little charity or help someone every day (even a smile is charity)." }
    ]},
    { category: "2. Emotional & Mental Well-being", items: [
      { id: "journal", title: "Night Journaling", desc: "Before sleeping, write your thoughts and worries in a diary." },
      { id: "metime", title: "1 Hour For Yourself", desc: "Spend one hour on your own terms, free from phone and noise." },
      { id: "breath", title: "Pause & Breathe", desc: "When angry or anxious, stop for 1 minute and take deep breaths." }
    ]},
    { category: "3. Body & Vitality", items: [
      { id: "walk", title: "Morning & Evening Walk", desc: "Walk outdoors in the fresh air each morning and evening." },
      { id: "stretch", title: "Gentle Stretching", desc: "Stretch for 5 minutes to release body tension and stress." },
      { id: "sleep", title: "Water & Sleep", desc: "Drink water through the day and sleep on time at night." }
    ]},
    { category: "4. Love For Life", items: [
      { id: "baat", title: "One Kind Conversation", desc: "Speak to a loved one with a smile, or ask how they are, every day." },
      { id: "khushi", title: "One Small Joy", desc: "Do one thing every day that brings a smile to your face." }
    ]}
  ];

  const ALL_IDS = habitData.flatMap(g => g.items.map(i => i.id));
  const TOTAL = ALL_IDS.length;
  const GOOD_DAY = 70; // % jis par din "kamyab" ginta hai (streak ke liye)
  const STORE_KEY = "almuntaha_v2";

  function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  let data = { days: {} };
  try {
    const saved = JSON.parse(storageGet(STORE_KEY));
    if (saved && saved.days) data = saved;
  } catch (e) {}
  function save() { storageSet(STORE_KEY, JSON.stringify(data)); }

  function keyOf(d) {
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${d.getFullYear()}-${m}-${day}`;
  }
  let todayKey = keyOf(new Date());

  function doneList(key) { return (data.days[key] || []).filter(id => ALL_IDS.includes(id)); }
  function pct(key) { return Math.round(doneList(key).length / TOTAL * 100); }

  // ---------- Aaj (Today) ----------
  const todayView = document.getElementById("todayView");

  function renderToday() {
    todayView.innerHTML = "";
    document.getElementById("currentDate").textContent =
      new Date().toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

    habitData.forEach(group => {
      const t = document.createElement("div");
      t.className = "category-title";
      t.textContent = group.category;
      todayView.appendChild(t);

      group.items.forEach(item => {
        const checked = doneList(todayKey).includes(item.id);
        const label = document.createElement("label");
        label.className = "habit-card" + (checked ? " completed" : "");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = checked;

        const info = document.createElement("div");
        info.className = "habit-info";
        const title = document.createElement("span");
        title.className = "habit-title";
        title.textContent = item.title;
        const desc = document.createElement("span");
        desc.className = "habit-desc";
        desc.textContent = item.desc;
        info.append(title, desc);
        label.append(cb, info);

        cb.addEventListener("change", () => {
          const list = new Set(doneList(todayKey));
          if (cb.checked) list.add(item.id); else list.delete(item.id);
          data.days[todayKey] = [...list];
          label.classList.toggle("completed", cb.checked);
          save();
          updateScore();
        });
        todayView.appendChild(label);
      });
    });

    const box = document.createElement("div");
    box.className = "score-box";
    box.innerHTML = `
      <div class="score-label">Today's Score</div>
      <div class="score-number" id="scorePercent">0<span>%</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
      <div class="score-summary" id="scoreSummary"></div>`;
    todayView.appendChild(box);
    updateScore();
  }

  function updateScore() {
    const count = doneList(todayKey).length;
    const p = pct(todayKey);
    document.getElementById("scorePercent").innerHTML = `${p}<span>%</span>`;
    document.getElementById("progressBar").style.width = p + "%";
    document.getElementById("scoreSummary").textContent = `${count}/${TOTAL} habits completed`;
  }

  // ---------- History ----------
  const historyView = document.getElementById("historyView");

  function dayDiff(a, b) {
    return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
  }

  function calcStreaks() {
    let cur = 0;
    const d = new Date();
    if (pct(keyOf(d)) < GOOD_DAY) d.setDate(d.getDate() - 1);
    while (pct(keyOf(d)) >= GOOD_DAY) { cur++; d.setDate(d.getDate() - 1); }

    let best = 0, run = 0, prev = null;
    Object.keys(data.days).sort().forEach(k => {
      if (pct(k) >= GOOD_DAY) {
        run = prev && dayDiff(prev, k) === 1 ? run + 1 : 1;
        prev = k;
        best = Math.max(best, run);
      } else { run = 0; prev = null; }
    });
    return { cur, best };
  }

  function renderHistory() {
    const { cur, best } = calcStreaks();
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push({ key: keyOf(d), label: d.toLocaleDateString("en-US", { weekday: "short" }) });
    }
    const avg = Math.round(days.reduce((s, d) => s + pct(d.key), 0) / 7);

    historyView.innerHTML = `
      <div class="category-title">Your Progress</div>
      <div class="stats">
        <div class="stat"><b>${cur}<i>days</i></b><small>Current Streak</small></div>
        <div class="stat"><b>${best}<i>days</i></b><small>Best Streak</small></div>
        <div class="stat"><b>${avg}<i>%</i></b><small>7-Day Average</small></div>
      </div>
      <p class="note">A day counts toward your streak when ${GOOD_DAY}% or more of your habits are completed.</p>
      <div class="category-title">Last 7 Days</div>
      <div class="week">
        ${days.map(d => {
          const p = pct(d.key);
          const cls = p >= GOOD_DAY ? "good" : p >= 40 ? "mid" : "";
          return `<div class="bar-col"><span class="bar-pct">${p}%</span><div class="bar ${cls}" style="height:${Math.max(p, 4) * 0.9}px"></div><span class="bar-day">${d.label}</span></div>`;
        }).join("")}
      </div>
      <div class="category-title">Data Backup</div>
      <p class="note" style="margin:0 0 10px">Your data is saved only in this browser. Download a backup before changing your phone or browser.</p>
      <div class="btn-row">
        <button class="btn" id="exportBtn">Download Backup</button>
        <button class="btn" id="importBtn">Restore Backup</button>
      </div>
      <input type="file" id="importFile" accept="application/json" class="hidden">`;

    document.getElementById("exportBtn").onclick = exportData;
    const fileInput = document.getElementById("importFile");
    document.getElementById("importBtn").onclick = () => fileInput.click();
    fileInput.onchange = importData;
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "almuntaha-backup-" + todayKey + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed.days !== "object") throw new Error("bad");
        data = { days: parsed.days };
        save();
        renderToday();
        renderHistory();
        alert("Backup restored successfully.");
      } catch (err) {
        alert("This file is not a valid backup.");
      }
    };
    reader.readAsText(file);
  }

  // ---------- Tabs ----------
  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
      const isToday = btn.dataset.tab === "today";
      todayView.classList.toggle("hidden", !isToday);
      historyView.classList.toggle("hidden", isToday);
      if (!isToday) renderHistory();
    });
  });

  // ---------- Midnight reset (agar page raat ko khula rahe) ----------
  setInterval(() => {
    const k = keyOf(new Date());
    if (k !== todayKey) {
      todayKey = k;
      renderToday();
      if (!historyView.classList.contains("hidden")) renderHistory();
    }
  }, 60000);

  renderToday();
</script>
</body>
</html>
